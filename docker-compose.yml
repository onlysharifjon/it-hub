services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ithub_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da berilishi shart}
      POSTGRES_DB: ithub_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port tashqariga ochilmaydi — backend DB'ga ichki docker tarmog'i orqali ulanadi.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ithub_user -d ithub_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend (FastAPI) ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://ithub_user:${POSTGRES_PASSWORD}@db:5432/ithub_db
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY .env da berilishi shart}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5373}
      CAMERA_API_KEY: ${CAMERA_API_KEY:-}   # bo'sh — kamera API o'chiq
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # ── Frontend (React + Nginx) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser connects to backend directly — must be accessible from user's machine
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "5373:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
