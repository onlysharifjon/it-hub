[tool.poetry]
name = "it-hub"
version = "0.1.0"
description = "IT Hub - O'quv markaz metodika tizimi"
authors = ["Sharifjon <pythonsharif@icloud.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.2"
uvicorn = {version = "^0.27.1", extras = ["standard"]}
sqlalchemy = "^2.0.27"
pydantic = "^1.10.14"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
python-dotenv = "^1.0.1"
bcrypt = ">=4.0.0,<5.0.0"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.0"
pytest-asyncio = "^0.23.5"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
